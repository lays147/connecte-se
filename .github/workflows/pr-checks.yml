name: PR Checks

on:
  pull_request:
    branches: [main]
    paths:
      - "sources/communities.yaml"
      - "sources/content.yaml"
      - "src/data/events-*.json"

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      sources: ${{ steps.filter.outputs.sources }}
      events: ${{ steps.filter.outputs.events }}
      content: ${{ steps.filter.outputs.content }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Detect changed files
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            sources:
              - 'sources/communities.yaml'
            events:
              - 'src/data/events-*.json'
            content:
              - 'sources/content.yaml'

  check-sources:
    needs: changes
    if: needs.changes.outputs.sources == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check source URLs
        env:
          CHECK_BASE_REF: origin/${{ github.event.pull_request.base.ref }}
        run: npm run check:sources

  check-events:
    needs: changes
    if: needs.changes.outputs.events == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check event URLs
        env:
          CHECK_BASE_REF: origin/${{ github.event.pull_request.base.ref }}
        run: npm run check:events

  check-content:
    needs: changes
    if: needs.changes.outputs.content == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check content URLs
        env:
          CHECK_BASE_REF: origin/${{ github.event.pull_request.base.ref }}
        run: npm run check:content
