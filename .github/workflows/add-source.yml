name: Add Source

on:
  workflow_dispatch:
    inputs:
      name:
        description: "Nome da comunidade ou evento"
        required: true
        type: string
      url:
        description: "URL da fonte (não pode ter data, ex: sem ano/mês/dia na URL)"
        required: true
        type: string
      type:
        description: "Tipo de fonte"
        required: true
        type: choice
        options:
          - community
          - event
      frequency:
        description: "Com que frequência acontece"
        required: true
        type: choice
        options:
          - monthly
          - yearly
          - occasionally

permissions:
  contents: write
  pull-requests: write

jobs:
  add-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Add source
        env:
          SOURCE_NAME: ${{ inputs.name }}
          SOURCE_URL: ${{ inputs.url }}
          SOURCE_TYPE: ${{ inputs.type }}
          SOURCE_FREQUENCY: ${{ inputs.frequency }}
        run: |
          npm run add:source -- \
            --name="$SOURCE_NAME" \
            --url="$SOURCE_URL" \
            --type="$SOURCE_TYPE" \
            --frequency="$SOURCE_FREQUENCY"

      - name: Open pull request
        uses: peter-evans/create-pull-request@v8
        with:
          commit-message: "feat: add ${{ inputs.name }} to sources"
          branch: add-source/${{ github.run_id }}
          title: "feat: add ${{ inputs.name }} to sources"
          body: |
            Adiciona uma nova fonte via workflow "Add Source", disparado por @${{ github.actor }}.

            - **Nome:** ${{ inputs.name }}
            - **URL:** ${{ inputs.url }}
            - **Tipo:** ${{ inputs.type }}
            - **Frequência:** ${{ inputs.frequency }}
          add-paths: sources/communities.yaml
