name: Add Event

on:
  workflow_dispatch:
    inputs:
      title:
        description: "Título do evento"
        required: true
        type: string
      city:
        description: "Cidade (use null para online ou local desconhecido)"
        required: true
        type: string
      state:
        description: "UF do estado - (RJ, SP, MG, etc) (use null quando não souber ao certo)"
        required: true
        type: string
      region:
        description: "Região"
        required: true
        type: choice
        options:
          - Sudeste
          - Sul
          - Nordeste
          - Norte
          - Centro-Oeste
      event_type:
        description: "Tipo de evento"
        required: true
        type: choice
        options:
          - Meetup
          - Meetup Online
          - Conferência
          - Congresso
          - Workshop
          - Summit
          - Festival
          - Community Day
          - Evento
      modality:
        description: "Modalidade do evento"
        required: true
        type: choice
        options:
          - Presencial
          - Online
          - Híbrido
          - Não informado
      date:
        description: "Data do evento (DD/MM/AAAA)"
        required: true
        type: string
      time:
        description: "Horário do evento (HH:mm, 24h)"
        required: false
        type: string
      description:
        description: "Descrição curta do evento"
        required: true
        type: string
      paid:
        description: "O evento é pago?"
        required: true
        type: boolean
        default: false
      url:
        description: "URL do evento"
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  add-event:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Add event
        env:
          EVENT_TITLE: ${{ inputs.title }}
          EVENT_CITY: ${{ inputs.city }}
          EVENT_STATE: ${{ inputs.state }}
          EVENT_REGION: ${{ inputs.region }}
          EVENT_TYPE: ${{ inputs.event_type }}
          EVENT_MODALITY: ${{ inputs.modality }}
          EVENT_DATE: ${{ inputs.date }}
          EVENT_TIME: ${{ inputs.time }}
          EVENT_DESCRIPTION: ${{ inputs.description }}
          EVENT_PAID: ${{ inputs.paid }}
          EVENT_URL: ${{ inputs.url }}
        run: |
          if [[ ! "$EVENT_DATE" =~ ^([0-3][0-9])/([0-1][0-9])/([0-9]{4})$ ]]; then
            echo "Data inválida \"$EVENT_DATE\": o formato esperado é DD/MM/AAAA" >&2
            exit 1
          fi
          ISO_DATE="${BASH_REMATCH[3]}-${BASH_REMATCH[2]}-${BASH_REMATCH[1]}"

          ARGS=(
            --title="$EVENT_TITLE"
            --city="$EVENT_CITY"
            --state="$EVENT_STATE"
            --region="$EVENT_REGION"
            --type="$EVENT_TYPE"
            --modality="$EVENT_MODALITY"
            --date="$ISO_DATE"
            --description="$EVENT_DESCRIPTION"
            --paid="$EVENT_PAID"
            --url="$EVENT_URL"
          )
          if [[ -n "$EVENT_TIME" ]]; then
            ARGS+=(--time="$EVENT_TIME")
          fi

          npm run add:event -- "${ARGS[@]}"

      - name: Open pull request
        uses: peter-evans/create-pull-request@v8
        with:
          commit-message: "feat: add ${{ inputs.title }} event"
          branch: add-event/${{ github.run_id }}
          title: "feat: add ${{ inputs.title }} event"
          body: |
            Adiciona um novo evento via workflow "Add Event", disparado por @${{ github.actor }}.

            - **Título:** ${{ inputs.title }}
            - **Cidade:** ${{ inputs.city }}
            - **Estado:** ${{ inputs.state }}
            - **Data:** ${{ inputs.date }}
            - **Horário:** ${{ inputs.time }}
            - **Região:** ${{ inputs.region }}
            - **Tipo:** ${{ inputs.event_type }}
            - **Modalidade:** ${{ inputs.modality }}
            - **Pago:** ${{ inputs.paid }}
            - **URL:** ${{ inputs.url }}
          add-paths: data/events-*.json
